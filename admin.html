                            <div class="flex items-center gap-2">
                                <span class="text-xs text-gray-500 font-bold">Rp</span>
                                <input type="number" id="plan-price-${prodKey}-${idx}" value="${plan.price}" class="w-28 text-xs border border-gray-200 rounded-lg p-2 font-semibold focus:outline-none focus:border-pink-500 bg-white" placeholder="Harga">
                                <button onclick="savePlan('${prodKey}', ${idx})" class="bg-pink-600 hover:bg-pink-700 text-white text-xs px-3 py-2 rounded-lg font-bold transition">Simpan</button>
                            </div>
                        </div>
                    `).join("");

                    card.innerHTML = `
                        <summary class="p-4 bg-gray-50/80 hover:bg-pink-50/50 cursor-pointer flex items-center justify-between transition list-none">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-pink-100 rounded-xl flex items-center justify-center text-pink-600 font-bold text-sm">
                                    ${prod.name ? prod.name.charAt(0) : '📦'}
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-800 text-sm">${prod.name || prodKey}</h3>
                                    <p class="text-xs text-gray-500">${prod.category || 'Tanpa Kategori'} • ${plans.length} Paket Tersedia</p>
                                </div>
                            </div>
                            <span class="text-xs text-pink-600 font-bold bg-pink-100 px-3 py-1 rounded-full group-open:bg-pink-600 group-open:text-white transition">
                                Edit Paket ✏️
                            </span>
                        </summary>
                        <div class="p-4 border-t border-pink-100">
                            <h4 class="text-xs font-bold text-gray-600 mb-3 uppercase tracking-wider">Daftar Paket & Harga:</h4>
                            ${plansHTML || '<p class="text-xs text-gray-400">Belum ada paket.</p>'}
                        </div>
                    `;

                    productListEl.appendChild(card);
                });
            });
        }

        // 5. Simpan Perubahan Paket
        window.savePlan = function(prodKey, planIdx) {
            const nameInput = document.getElementById(`plan-name-${prodKey}-${planIdx}`);
            const priceInput = document.getElementById(`plan-price-${prodKey}-${planIdx}`);

            if (!nameInput || !priceInput) return;

            const newName = nameInput.value.trim();
            const newPrice = Number(priceInput.value);

            if (!newName || isNaN(newPrice)) {
                alert("Mohon masukkan nama dan harga yang valid!");
                return;
            }

            const planRef = ref(db, `products/${prodKey}/plans/${planIdx}`);
            update(planRef, { name: newName, price: newPrice })
                .then(() => alert(`Berhasil memperbarui ${newName}! ✨`))
                .catch(err => alert("Gagal memperbarui: " + err.message));
        };

        // 6. Logout
        if (btnLogout) {
            btnLogout.addEventListener("click", () => {
                signOut(auth).then(() => window.location.href = "login.html");
            });
        }
    </script>
</body>
</html>
