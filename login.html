<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin — Deyie Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #fff0f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { background: white; width: 100%; max-width: 380px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3); border: 2px solid #ffb6c1; text-align: center; }
        .login-card h2 { color: #d81b60; margin-bottom: 8px; font-size: 22px; }
        .login-card p { color: #777; font-size: 13px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #d81b60; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #ffc0cb; border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: #d81b60; box-shadow: 0 0 5px rgba(216, 27, 96, 0.2); }
        .btn-login { width: 100%; padding: 12px; background: #d81b60; color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; margin-top: 10px; transition: 0.2s; }
        .btn-login:hover { background: #c2185b; }
        .error-msg { color: #e53935; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Login Admin 🎀</h2>
    <p>Masuk untuk mengelola katalog produk</p>
    
    <form id="login-form">
        <div class="form-group">
            <label>Email Admin</label>
            <input type="email" id="email" placeholder="admin@gmail.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Masuk ✨</button>
        <p id="error-msg" class="error-msg">Email atau password salah!</p>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBoDgZVyBykd-sOjyvIl0cdAC0uEeB8HOI",
        authDomain: "deyie-store.firebaseapp.com",
        databaseURL: "https://deyie-store-default-rtdb.firebaseio.com",
        projectId: "deyie-store",
        storageBucket: "deyie-store.firebasestorage.app",
        messagingSenderId: "28562864228",
        appId: "1:28562864228:web:fa797db9f6dd7daece0771"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Jika sudah login sebelumnya, langsung lempar ke admin.html
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = "admin.html";
        }
    });

    const loginForm = document.getElementById("login-form");
    const errorMsg = document.getElementById("error-msg");

    loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const emailVal = document.getElementById("email").value.trim();
        const passVal = document.getElementById("password").value;

        signInWithEmailAndPassword(auth, emailVal, passVal)
            .then(() => {
                window.location.href = "admin.html";
            })
            .catch((err) => {
                errorMsg.style.display = "block";
                errorMsg.textContent = "Gagal login: " + err.message;
            });
    });
</script>

</body>
</html>
